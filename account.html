<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AZHA MOH</title>
    <style>
      :root {
        --bg: #060b12;
        --bg-2: #101827;
        --panel: rgba(15, 23, 42, 0.96);
        --panel-strong: rgba(17, 24, 39, 0.98);
        --muted: #cbd5e1;
        --text: #f8fafc;
        --accent: #8b5cf6;
        --accent-2: #22d3ee;
        --success: #34d399;
        --error: #f87171;
        --border: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #122033 0%, #0a1220 32%, var(--bg) 100%);
        color: var(--text);
      }

      .auth-shell {
        width: min(1100px, 90vw);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .brand-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 10px;
      }

      .brand-logo {
        width: 110px;
        height: 110px;
        object-fit: contain;
        filter: drop-shadow(0 0 18px rgba(34, 211, 238, 0.45));
      }

      .brand-block h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 4rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: linear-gradient(135deg, #ffffff 0%, #8b5cf6 30%, #22d3ee 65%, #a7f3d0 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .auth-card {
        width: min(900px, 100%);
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: 0 28px 60px rgba(15, 23, 42, 0.6);
        padding: 28px;
      }

      .session-panel {
        display: none;
        margin-bottom: 18px;
        padding: 18px 20px;
        border-radius: 16px;
        background: rgba(52, 211, 153, 0.08);
        border: 1px solid rgba(52, 211, 153, 0.35);
      }

      .session-panel.visible {
        display: block;
      }

      .session-panel h2 {
        margin: 0 0 8px;
      }

      .session-panel p {
        margin: 0;
        color: var(--muted);
      }

      .admin-panel {
        display: none;
        margin-top: 18px;
        padding: 18px 20px;
        border-radius: 18px;
        background: rgba(139, 92, 246, 0.08);
        border: 1px solid rgba(139, 92, 246, 0.35);
      }

      .admin-panel.visible {
        display: block;
      }

      .admin-panel h3 {
        margin: 0 0 12px;
      }

      .admin-user-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .admin-user {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
      }

      .admin-user strong,
      .admin-user small {
        display: block;
      }

      .admin-user small {
        margin-top: 4px;
        color: var(--muted);
      }

      .admin-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .mini-btn {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        cursor: pointer;
        font-weight: 700;
      }

      .mini-btn.danger {
        border-color: rgba(248, 113, 113, 0.4);
        color: #fecaca;
      }

      .auth-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 16px;
      }

      .button-link,
      .primary-btn,
      .secondary-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border-radius: 12px;
        text-decoration: none;
        border: none;
        cursor: pointer;
        font-weight: 700;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .primary-btn,
      .button-link {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
      }

      .secondary-btn {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .primary-btn:hover,
      .button-link:hover,
      .secondary-btn:hover {
        transform: translateY(-1px);
      }

      .auth-forms {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }

      .form-panel {
        background: rgba(15, 23, 42, 0.64);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 22px;
      }

      .form-panel h2 {
        margin: 0 0 18px;
        font-size: 1.7rem;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font-size: 1rem;
      }

      input::placeholder {
        color: rgba(226, 232, 240, 0.7);
      }

      .status-message {
        min-height: 24px;
        margin-top: 18px;
        font-weight: 600;
      }

      .status-message.error {
        color: var(--error);
      }

      .status-message.success {
        color: var(--success);
      }

      @media (max-width: 700px) {
        .auth-forms {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="auth-shell">
      <div class="brand-block">
        <img class="brand-logo" src="channels4_profile.jpg" alt="AZHA MOH logo" />
        <h1>AZHA MOH</h1>
      </div>

      <section class="auth-card">
        <div id="sessionPanel" class="session-panel">
          <h2>Welcome back</h2>
          <p id="sessionStatusText">You are signed in.</p>
          <div class="auth-actions">
            <a class="button-link" href="Talk.html">Go to messages</a>
            <button id="logoutBtn" class="secondary-btn" type="button">Log out</button>
          </div>

          <div id="adminPanel" class="admin-panel">
            <h3>Admin controls</h3>
            <div id="adminUsersList" class="admin-user-list"></div>
          </div>
        </div>

        <div id="authForms" class="auth-forms">
          <div class="form-panel">
            <h2>Login</h2>
            <form id="loginForm">
              <input id="loginEmail" type="email" placeholder="Email" required />
              <input id="loginPassword" type="password" placeholder="Password" required />
              <button class="primary-btn" type="submit">Login</button>
            </form>
          </div>

          <div class="form-panel">
            <h2>Sign Up</h2>
            <form id="signupForm">
              <input id="signupUsername" type="text" placeholder="Username" required />
              <input id="signupEmail" type="email" placeholder="Email" required />
              <input id="signupPassword" type="password" placeholder="Password" required />
              <button class="primary-btn" type="submit">Create Account</button>
            </form>
          </div>
        </div>

        <p id="statusMessage" class="status-message"></p>
      </section>
    </main>

    <script src="accounts.js"></script>
    <script>
      const {
        getCurrentUser,
        login,
        createAccount,
        logout,
        getAllUsers,
        updateUserRole,
        deleteUser,
        isCurrentUserAdmin,
        clearSession
      } = window.AZHAAccounts;

      if (!window.__AZHA_BOOTSTRAP__) {
        clearSession();
        window.__AZHA_BOOTSTRAP__ = true;
      }

      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const sessionPanel = document.getElementById('sessionPanel');
      const sessionStatusText = document.getElementById('sessionStatusText');
      const adminPanel = document.getElementById('adminPanel');
      const adminUsersList = document.getElementById('adminUsersList');
      const authForms = document.getElementById('authForms');
      const statusMessage = document.getElementById('statusMessage');
      const logoutBtn = document.getElementById('logoutBtn');

      function showStatus(message, isError = false) {
        statusMessage.textContent = message;
        statusMessage.classList.remove('error', 'success');
        statusMessage.classList.add(isError ? 'error' : 'success');
      }

      function renderAdminPanel() {
        const currentUser = getCurrentUser();
        const isAdmin = Boolean(currentUser && (currentUser.role === 'admin' || currentUser.isAdmin));

        if (!isAdmin) {
          adminPanel.classList.remove('visible');
          return;
        }

        adminPanel.classList.add('visible');
        const users = getAllUsers();

        adminUsersList.innerHTML = users
          .map((user) => {
            const isMainAdmin = user.email === 'bestazhafgame@gmail.com';
            return `
              <div class="admin-user">
                <div>
                  <strong>${user.username}</strong>
                  <small>${user.email}</small>
                </div>
                <div class="admin-actions">
                  <button class="mini-btn" type="button" data-role-id="${user.id}" data-role="${user.role === 'admin' ? 'user' : 'admin'}">
                    ${user.role === 'admin' ? 'Remove admin' : 'Make admin'}
                  </button>
                  ${isMainAdmin ? '' : `<button class="mini-btn danger" type="button" data-delete-id="${user.id}">Delete</button>`}
                </div>
              </div>
            `;
          })
          .join('');

        adminUsersList.querySelectorAll('[data-role-id]').forEach((button) => {
          button.addEventListener('click', () => {
            const result = updateUserRole(button.dataset.roleId, button.dataset.role);
            if (!result.success) {
              showStatus(result.message, true);
              return;
            }
            showStatus('User role updated.', false);
            renderAccountState();
          });
        });

        adminUsersList.querySelectorAll('[data-delete-id]').forEach((button) => {
          button.addEventListener('click', () => {
            const result = deleteUser(button.dataset.deleteId);
            if (!result.success) {
              showStatus(result.message, true);
              return;
            }
            showStatus('User deleted.', false);
            renderAccountState();
          });
        });
      }

      function renderAccountState() {
        const currentUser = getCurrentUser();

        if (currentUser) {
          sessionPanel.classList.add('visible');
          authForms.style.display = 'none';
          sessionStatusText.textContent = `Signed in as ${currentUser.username}${isCurrentUserAdmin() ? ' (Admin)' : ''}.`;
          renderAdminPanel();
          showStatus('');
        } else {
          sessionPanel.classList.remove('visible');
          adminPanel.classList.remove('visible');
          authForms.style.display = 'grid';
        }
      }

      loginForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const result = login({ email, password });

        if (!result.success) {
          showStatus(result.message, true);
          return;
        }

        showStatus('Login successful!', false);
        loginForm.reset();
        renderAccountState();
      });

      signupForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const username = document.getElementById('signupUsername').value;
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;
        const result = createAccount({ username, email, password });

        if (!result.success) {
          showStatus(result.message, true);
          return;
        }

        showStatus('Account created successfully!', false);
        signupForm.reset();
        renderAccountState();
      });

      logoutBtn.addEventListener('click', () => {
        logout();
        renderAccountState();
        showStatus('You are now signed out.', false);
      });

      renderAccountState();
    </script>
  </body>
</html>
