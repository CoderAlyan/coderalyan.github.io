<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore | CoderAlyan</title>
    <link rel="icon" type="image/png" href="ChatGPT Image Aug 22, 2026, 07_30_36 AM.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #0b1020;
        color: #f4f7ff;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 80px 24px;
      }

      .section {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.03);
        padding: 40px 24px;
      }

      h2 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3rem);
        color: #ffffff;
      }

      .search-bar {
        margin-top: 20px;
        width: 100%;
        max-width: 360px;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.04);
        color: #f4f7ff;
        font-size: 1rem;
      }

      .search-bar::placeholder {
        color: rgba(244, 247, 255, 0.45);
      }

      .search-bar:focus {
        outline: none;
        border-color: #22d3ee;
      }

      .no-results {
        display: none;
        margin-top: 16px;
        color: rgba(244, 247, 255, 0.6);
      }

      .azha-brand {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .azha-brand-label {
        font-size: 0.7rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: rgba(244, 247, 255, 0.6);
      }

      .azha-brand-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .azha-brand-logo {
        width: 42px;
        height: 42px;
        object-fit: contain;
        filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.5));
      }

      .azha-brand-text {
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        background: linear-gradient(135deg, #ffffff 0%, #8b5cf6 30%, #22d3ee 60%, #a7f3d0 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
      }

      .account-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 20;
        padding: 12px 18px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: #f8fbff;
        font-weight: 700;
        cursor: pointer;
      }

      .account-modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(5, 8, 15, 0.75);
        z-index: 30;
      }

      .account-modal.open {
        display: flex;
      }

      .account-card {
        width: min(92vw, 420px);
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 22px;
        padding: 24px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      }

      .account-card h3 {
        margin: 0 0 18px;
        text-align: center;
        font-size: 1.7rem;
      }

      .account-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .account-form input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: #fff;
      }

      .account-form button {
        padding: 12px 18px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #8b5cf6, #22d3ee);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      .account-user-panel {
        display: none;
        margin-bottom: 18px;
        padding: 18px 16px;
        border-radius: 14px;
        background: rgba(34, 211, 238, 0.08);
        border: 1px solid rgba(34, 211, 238, 0.25);
      }

      .account-user-panel.visible {
        display: block;
      }

      .account-user-panel p {
        margin: 0 0 10px;
        color: rgba(244, 247, 255, 0.86);
      }

      .account-user-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
      }

      .manage-link,
      .logout-inline {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        text-decoration: none;
        cursor: pointer;
        font-weight: 700;
      }

      .manage-link {
        background: rgba(255, 255, 255, 0.06);
        color: #f4f7ff;
      }

      .logout-inline {
        background: rgba(248, 113, 113, 0.12);
        color: #fecaca;
      }

      .account-message {
        min-height: 22px;
        margin-top: 12px;
        font-size: 0.9rem;
        color: #8be9fd;
      }

      .close-btn {
        float: right;
        background: transparent;
        border: none;
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="accountBtn" class="account-btn">Account</button>

    <div id="accountModal" class="account-modal">
      <div class="account-card">
        <button type="button" id="closeAccountModal" class="close-btn">×</button>
        <h3>Account</h3>

        <div id="userAccountPanel" class="account-user-panel">
          <p>Signed in as <strong id="accountUserName">User</strong></p>
          <p id="accountUserEmail">user@example.com</p>
          <div class="account-user-actions">
            <a class="manage-link" href="account.html">Manage account</a>
            <button id="logoutFromMenuBtn" class="logout-inline" type="button">Log out</button>
          </div>
        </div>

        <form id="loginForm" class="account-form">
          <input type="email" id="loginEmail" placeholder="Email" required />
          <input type="password" id="loginPassword" placeholder="Password" required />
          <button type="submit">Login</button>
        </form>

        <hr id="authDivider" style="margin: 18px 0; border-color: rgba(255,255,255,0.08);" />

        <form id="signupForm" class="account-form">
          <input type="text" id="signupUsername" placeholder="Display name" />
          <input type="email" id="signupEmail" placeholder="Email" required />
          <input type="password" id="signupPassword" placeholder="Create password" required />
          <button type="submit">Create Account</button>
        </form>

        <div id="accountMessage" class="account-message"></div>
      </div>
    </div>

    <main class="container">
      <section class="section">
        <a href="index.html" style="display: inline-block; margin-bottom: 20px; padding: 12px 20px; background: rgba(255, 255, 255, 0.06); color: #e2e8f0; text-decoration: none; font-weight: 700; border-radius: 999px; border: 1px solid rgba(255,255,255,0.15);">Return</a>
        <h2>Other Coder Alyan Websites</h2>
        <br />
        <input
          type="text"
          id="siteSearch"
          class="search-bar"
          placeholder="Search websites..."
        />
        <div id="siteLinks" style="display: flex; flex-wrap: wrap; gap: 16px; margin-top: 20px;">
          <a href="https://google2o.base44.app/" target="_blank" rel="noopener noreferrer" style="display: inline-block; padding: 14px 22px; background: linear-gradient(135deg, #8b5cf6, #22d3ee); color: white; text-decoration: none; font-weight: 700; border-radius: 999px; box-shadow: 0 12px 30px rgba(34, 211, 238, 0.35);">Google 2.0</a>
          <a href="https://apitchmasterfc.base44.app" target="_blank" rel="noopener noreferrer" style="display: inline-block; padding: 14px 22px; background: linear-gradient(135deg, #8b5cf6, #22d3ee); color: white; text-decoration: none; font-weight: 700; border-radius: 999px; box-shadow: 0 12px 30px rgba(34, 211, 238, 0.35);">Pitch Master</a>
          <a href="https://citycrafter.base44.app/" target="_blank" rel="noopener noreferrer" style="display: inline-block; padding: 14px 22px; background: linear-gradient(135deg, #8b5cf6, #22d3ee); color: white; text-decoration: none; font-weight: 700; border-radius: 999px; box-shadow: 0 12px 30px rgba(34, 211, 238, 0.35);">City Crafter</a>
          <a href="https://coderalyan.github.io/CA2/" target="_blank" rel="noopener noreferrer" style="display: inline-block; padding: 14px 22px; background: linear-gradient(135deg, #8b5cf6, #22d3ee); color: white; text-decoration: none; font-weight: 700; border-radius: 999px; box-shadow: 0 12px 30px rgba(34, 211, 238, 0.35);">CoderAlyan 2</a>
        </div>
        <p class="no-results" id="noResults">No websites match your search.</p>
      </section>
    </main>
    <div class="azha-brand">
      <span class="azha-brand-label">Created by</span>
      <div class="azha-brand-row">
        <img src="channels4_profile.jpg" alt="AZHA MOH logo" class="azha-brand-logo" />
        <span class="azha-brand-text">AZHA MOH</span>
      </div>
    </div>

    <script>
      const searchInput = document.getElementById('siteSearch');
      const links = Array.from(document.querySelectorAll('#siteLinks a'));
      const noResults = document.getElementById('noResults');

      searchInput.addEventListener('input', () => {
        const query = searchInput.value.trim().toLowerCase();
        let visibleCount = 0;

        links.forEach((link) => {
          const matches = link.textContent.toLowerCase().includes(query);
          link.style.display = matches ? '' : 'none';
          if (matches) visibleCount++;
        });

        noResults.style.display = visibleCount === 0 ? 'block' : 'none';
      });
    </script>

    <script src="accounts.js"></script>
    <script>
      const { getCurrentUser, login, createAccount, logout } = window.AZHAAccounts;

      function setMessage(text, isError = false) {
        const el = document.getElementById('accountMessage');
        if (!el) return;
        el.textContent = text;
        el.style.color = isError ? '#ff9aa2' : '#8be9fd';
      }

      function updateAccountButton() {
        const button = document.getElementById('accountBtn');
        const userAccountPanel = document.getElementById('userAccountPanel');
        const accountUserName = document.getElementById('accountUserName');
        const accountUserEmail = document.getElementById('accountUserEmail');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const authDivider = document.getElementById('authDivider');
        const logoutFromMenuBtn = document.getElementById('logoutFromMenuBtn');
        const currentUser = getCurrentUser();

        if (!button) return;
        button.textContent = currentUser ? currentUser.email : 'Account';

        const isLoggedIn = Boolean(currentUser);
        if (userAccountPanel) {
          userAccountPanel.classList.toggle('visible', isLoggedIn);
        }
        if (loginForm) loginForm.style.display = isLoggedIn ? 'none' : 'flex';
        if (signupForm) signupForm.style.display = isLoggedIn ? 'none' : 'flex';
        if (authDivider) authDivider.style.display = isLoggedIn ? 'none' : 'block';

        if (currentUser && accountUserName && accountUserEmail) {
          accountUserName.textContent = currentUser.username || 'User';
          accountUserEmail.textContent = currentUser.email;
        }

        if (logoutFromMenuBtn) {
          logoutFromMenuBtn.onclick = () => {
            logout();
            updateAccountButton();
            setMessage('Signed out.');
          };
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        const accountBtn = document.getElementById('accountBtn');
        const accountModal = document.getElementById('accountModal');
        const closeBtn = document.getElementById('closeAccountModal');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');

        updateAccountButton();

        accountBtn.addEventListener('click', () => {
          updateAccountButton();
          accountModal.classList.add('open');
          setMessage('');
        });

        closeBtn.addEventListener('click', () => {
          accountModal.classList.remove('open');
        });

        accountModal.addEventListener('click', (event) => {
          if (event.target === accountModal) {
            accountModal.classList.remove('open');
          }
        });

        loginForm.addEventListener('submit', (event) => {
          event.preventDefault();
          const email = document.getElementById('loginEmail').value.trim();
          const password = document.getElementById('loginPassword').value;
          const result = login({ email, password });

          if (!result.success) {
            setMessage(result.message, true);
            return;
          }

          updateAccountButton();
          accountModal.classList.remove('open');
          loginForm.reset();
          setMessage('Logged in successfully!');
        });

        signupForm.addEventListener('submit', (event) => {
          event.preventDefault();
          const displayName = document.getElementById('signupUsername').value.trim();
          const email = document.getElementById('signupEmail').value.trim();
          const password = document.getElementById('signupPassword').value;
          const result = createAccount({ username: displayName, email, password });

          if (!result.success) {
            setMessage(result.message, true);
            return;
          }

          updateAccountButton();
          accountModal.classList.remove('open');
          signupForm.reset();
          setMessage('Account created successfully!');
        });

        accountBtn.addEventListener('dblclick', () => {
          logout();
          updateAccountButton();
          setMessage('Signed out.');
        });
      });
    </script>
  </body>
</html>
