<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #1a1f35 0%, #0b1020 35%, #05070d 100%);
        color: #f4f7ff;
      }

      .hero {
        text-align: center;
        padding: 48px 24px;
        max-width: 1200px;
      }

      .eyebrow {
        margin: 0 0 18px;
        font-size: 0.8rem;
        letter-spacing: 0.35rem;
        text-transform: uppercase;
        color: #7dd3fc;
      }

      .logo {
        display: block;
        width: min(35vw, 350px);
        max-width: 100%;
        margin: 0 auto 8px;
        filter: drop-shadow(0 0 18px rgba(34, 211, 238, 0.5));
      }

      .coderalyan {
        margin: 0;
        font-size: clamp(3rem, 10vw, 9rem);
        font-weight: 900;
        line-height: 0.9;
        letter-spacing: -0.08em;
        background: linear-gradient(135deg, #ffffff 0%, #8b5cf6 30%, #22d3ee 60%, #a7f3d0 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        animation: glow 3s ease-in-out infinite alternate;
      }

      .tagline {
        margin: 20px auto 0;
        max-width: 760px;
        font-size: clamp(1rem, 2vw, 1.5rem);
        color: rgba(244, 247, 255, 0.8);
      }

      .buttons {
        margin-top: 28px;
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .buttons a {
        display: inline-block;
        padding: 14px 26px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .buttons a:hover {
        transform: translateY(-2px);
      }

      .buttons a:first-child {
        background: linear-gradient(135deg, #8b5cf6, #22d3ee);
        color: white;
        box-shadow: 0 12px 30px rgba(34, 211, 238, 0.35);
      }

      .buttons a.secondary {
        background: rgba(255, 255, 255, 0.06);
        color: #e2e8f0;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 16px rgba(139, 92, 246, 0.45), 0 0 28px rgba(34, 211, 238, 0.25);
        }
        to {
          text-shadow: 0 0 22px rgba(34, 211, 238, 0.6), 0 0 38px rgba(167, 243, 208, 0.35);
        }
      }

      .azha-brand {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .azha-brand-label {
        font-size: 0.7rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: rgba(244, 247, 255, 0.6);
      }

      .azha-brand-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .azha-brand-logo {
        width: 42px;
        height: 42px;
        object-fit: contain;
        filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.5));
      }

      .azha-brand-text {
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        background: linear-gradient(135deg, #ffffff 0%, #8b5cf6 30%, #22d3ee 60%, #a7f3d0 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
      }

      .account-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 20;
        padding: 12px 18px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: #f8fbff;
        font-weight: 700;
        cursor: pointer;
      }

      .account-modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(5, 8, 15, 0.75);
        z-index: 30;
      }

      .account-modal.open {
        display: flex;
      }

      .account-card {
        width: min(92vw, 420px);
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 22px;
        padding: 24px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      }

      .account-card h3 {
        margin: 0 0 18px;
        text-align: center;
        font-size: 1.7rem;
      }

      .account-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .account-form input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: #fff;
      }

      .account-form button {
        padding: 12px 18px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #8b5cf6, #22d3ee);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      .account-message {
        min-height: 22px;
        margin-top: 12px;
        font-size: 0.9rem;
        color: #8be9fd;
      }

      .close-btn {
        float: right;
        background: transparent;
        border: none;
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
      }
      </style>
  </head>
  <body>
    <button id="accountBtn" class="account-btn">Account</button>

    <div id="accountModal" class="account-modal">
      <div class="account-card">
        <button type="button" id="closeAccountModal" class="close-btn">×</button>
        <h3>Account</h3>

        <form id="loginForm" class="account-form">
          <input type="email" id="loginEmail" placeholder="Email" required />
          <input type="password" id="loginPassword" placeholder="Password" required />
          <button type="submit">Login</button>
        </form>

        <hr style="margin: 18px 0; border-color: rgba(255,255,255,0.08);" />

        <form id="signupForm" class="account-form">
          <input type="text" id="signupUsername" placeholder="Display name" />
          <input type="email" id="signupEmail" placeholder="Email" required />
          <input type="password" id="signupPassword" placeholder="Create password" required />
          <button type="submit">Create Account</button>
        </form>

        <div id="accountMessage" class="account-message"></div>
      </div>
    </div>

    <div style="position: fixed; top: 20px; left: 20px; z-index: 10;">
      <a href="index.html" style="display: inline-block; padding: 12px 20px; background: rgba(255, 255, 255, 0.06); color: #e2e8f0; text-decoration: none; font-weight: 700; border-radius: 999px; border: 1px solid rgba(255,255,255,0.15);">Return</a>
    </div>
    <a href="https://azha-moh.vercel.app/" target="_blank" rel="noopener noreferrer" >Inpired by AZHA MOH's Website</a>
    <H2>AZHA MOH - ALY V1.0.0</H2>
    <div class="azha-brand">
      <span class="azha-brand-label">Created by</span>
      <div class="azha-brand-row">
        <img src="channels4_profile.jpg" alt="AZHA MOH logo" class="azha-brand-logo" />
        <span class="azha-brand-text">AZHA MOH</span>
      </div>
    </div>

    <script src="accounts.js"></script>
    <script>
      const { getCurrentUser, login, createAccount, logout } = window.AZHAAccounts;

      function setMessage(text, isError = false) {
        const el = document.getElementById('accountMessage');
        if (!el) return;
        el.textContent = text;
        el.style.color = isError ? '#ff9aa2' : '#8be9fd';
      }

      function updateAccountButton() {
        const button = document.getElementById('accountBtn');
        if (!button) return;
        const currentUser = getCurrentUser();
        button.textContent = currentUser ? currentUser.email : 'Account';
      }

      document.addEventListener('DOMContentLoaded', () => {
        const accountBtn = document.getElementById('accountBtn');
        const accountModal = document.getElementById('accountModal');
        const closeBtn = document.getElementById('closeAccountModal');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');

        updateAccountButton();

        accountBtn.addEventListener('click', () => {
          accountModal.classList.add('open');
          setMessage('');
        });

        closeBtn.addEventListener('click', () => {
          accountModal.classList.remove('open');
        });

        accountModal.addEventListener('click', (event) => {
          if (event.target === accountModal) {
            accountModal.classList.remove('open');
          }
        });

        loginForm.addEventListener('submit', (event) => {
          event.preventDefault();
          const email = document.getElementById('loginEmail').value.trim();
          const password = document.getElementById('loginPassword').value;
          const result = login({ email, password });

          if (!result.success) {
            setMessage(result.message, true);
            return;
          }

          updateAccountButton();
          accountModal.classList.remove('open');
          loginForm.reset();
          setMessage('Logged in successfully!');
        });

        signupForm.addEventListener('submit', (event) => {
          event.preventDefault();
          const displayName = document.getElementById('signupUsername').value.trim();
          const email = document.getElementById('signupEmail').value.trim();
          const password = document.getElementById('signupPassword').value;
          const result = createAccount({ username: displayName, email, password });

          if (!result.success) {
            setMessage(result.message, true);
            return;
          }

          updateAccountButton();
          accountModal.classList.remove('open');
          signupForm.reset();
          setMessage('Account created successfully!');
        });

        accountBtn.addEventListener('dblclick', () => {
          logout();
          updateAccountButton();
          setMessage('Signed out.');
        });
      });
    </script>
  </body>
</html>
