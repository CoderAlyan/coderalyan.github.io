<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoderAlyan</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; font-family: Arial, Helvetica, sans-serif; background: radial-gradient(circle at top, #1a1f35 0%, #0b1020 45%, #05070d 100%); color: #f4f7ff; }
    .hero { text-align: center; max-width: 1000px; }
    .eyebrow { color: #7dd3fc; letter-spacing: .3em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(3rem, 10vw, 8rem); letter-spacing: -.07em; background: linear-gradient(135deg,#fff,#8b5cf6 35%,#22d3ee 70%,#a7f3d0); background-clip: text; color: transparent; }
    .tagline { color: rgba(244,247,255,.8); font-size: clamp(1rem,2vw,1.4rem); }
    .buttons { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .buttons a, .return { padding: 13px 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: #f4f7ff; text-decoration: none; font-weight: 700; }
    .buttons a:first-child { background: linear-gradient(135deg,#8b5cf6,#22d3ee); }
    .copilot-credit { position: fixed; right: 20px; bottom: 20px; color: rgba(244,247,255,.72); font-size: .85rem; }
  </style>
</head>
<body>
  <main class="hero">
    <p class="eyebrow">Code • Create • Conquer</p>
    <h1>CoderAlyan</h1>
    <p class="tagline">Building sleek digital experiences with creativity, code, and bold ideas.</p>
    <nav class="buttons" aria-label="Main navigation">
      <a href="Explore.html">Explore Other Websites</a>

      <a href="Games.html">Games</a>
      <a href="Search.html">Search</a>
    </nav>
  </main>
  <footer class="copilot-credit">Made With: GitHub Copilot</footer>
</body>
</html>
