<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search | CoderAlyan</title>
    <link rel="icon" type="image/png" href="ChatGPT Image Aug 22, 2026, 07_30_36 AM.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #0b1020;
        color: #f4f7ff;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 80px 24px;
      }

      .return-btn {
        display: inline-block;
        margin-bottom: 20px;
        padding: 12px 20px;
        background: rgba(255, 255, 255, 0.06);
        color: #e2e8f0;
        text-decoration: none;
        font-weight: 700;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      .section {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.03);
        padding: 40px 24px;
      }

      h2 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3rem);
        color: #ffffff;
      }

      .subtitle {
        margin: 10px 0 0;
        color: rgba(244, 247, 255, 0.7);
      }

      .search-bar {
        margin-top: 20px;
        width: 100%;
        max-width: 480px;
        padding: 14px 18px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.04);
        color: #f4f7ff;
        font-size: 1.05rem;
      }

      .search-bar::placeholder {
        color: rgba(244, 247, 255, 0.45);
      }

      .search-bar:focus {
        outline: none;
        border-color: #22d3ee;
      }

      .no-results {
        display: none;
        margin-top: 16px;
        color: rgba(244, 247, 255, 0.6);
      }

      .result-count {
        margin-top: 20px;
        font-size: 0.8rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: rgba(244, 247, 255, 0.5);
      }

      .result-list {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .result-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        text-decoration: none;
        color: #f4f7ff;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }

      .result-card:hover {
        transform: translateY(-2px);
        border-color: #22d3ee;
      }

      .result-info h3 {
        margin: 0 0 4px;
        font-size: 1.1rem;
        color: #ffffff;
      }

      .result-info p {
        margin: 0;
        font-size: 0.85rem;
        color: rgba(244, 247, 255, 0.65);
      }

      .badge {
        flex-shrink: 0;
        display: inline-block;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        background: linear-gradient(135deg, #8b5cf6, #22d3ee);
        color: white;
        white-space: nowrap;
      }

      .result-card.web {
        border-style: dashed;
        border-color: rgba(125, 211, 252, 0.4);
      }

      .result-card.web .badge {
        background: rgba(255, 255, 255, 0.08);
        color: #7dd3fc;
      }

      .azha-brand {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .azha-brand-label {
        font-size: 0.7rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: rgba(244, 247, 255, 0.6);
      }

      .azha-brand-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .azha-brand-logo {
        width: 42px;
        height: 42px;
        object-fit: contain;
        filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.5));
      }

      .azha-brand-text {
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        background: linear-gradient(135deg, #ffffff 0%, #8b5cf6 30%, #22d3ee 60%, #a7f3d0 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
      }

      .account-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 20;
        padding: 12px 18px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: #f8fbff;
        font-weight: 700;
        cursor: pointer;
      }

      .account-modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(5, 8, 15, 0.75);
        z-index: 30;
      }

      .account-modal.open {
        display: flex;
      }

      .account-card {
        width: min(92vw, 420px);
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 22px;
        padding: 24px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      }

      .account-card h3 {
        margin: 0 0 18px;
        text-align: center;
        font-size: 1.7rem;
      }

      .account-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .account-form input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: #fff;
      }

      .account-form button {
        padding: 12px 18px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #8b5cf6, #22d3ee);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      .account-message {
        min-height: 22px;
        margin-top: 12px;
        font-size: 0.9rem;
        color: #8be9fd;
      }

      .close-btn {
        float: right;
        background: transparent;
        border: none;
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="accountBtn" class="account-btn">Account</button>

    <div id="accountModal" class="account-modal">
      <div class="account-card">
        <button type="button" id="closeAccountModal" class="close-btn">×</button>
        <h3>Account</h3>

        <form id="loginForm" class="account-form">
          <input type="email" id="loginEmail" placeholder="Email" required />
          <input type="password" id="loginPassword" placeholder="Password" required />
          <button type="submit">Login</button>
        </form>

        <hr style="margin: 18px 0; border-color: rgba(255,255,255,0.08);" />

        <form id="signupForm" class="account-form">
          <input type="text" id="signupUsername" placeholder="Display name" />
          <input type="email" id="signupEmail" placeholder="Email" required />
          <input type="password" id="signupPassword" placeholder="Create password" required />
          <button type="submit">Create Account</button>
        </form>

        <div id="accountMessage" class="account-message"></div>
      </div>
    </div>

    <main class="container">
      <section class="section">
        <a href="index.html" class="return-btn">Return</a>
        <h2>Search</h2>
        <p class="subtitle">Find anything across CoderAlyan.</p>

        <input
          type="text"
          id="siteSearch"
          class="search-bar"
          placeholder="Search anything — pages, games, players, or the web..."
          autofocus
        />

        <p class="result-count" id="resultCount"></p>
        <div class="result-list" id="resultList"></div>
        <p class="no-results" id="noResults">Nothing matches your search.</p>
      </section>
    </main>

    <div class="azha-brand">
      <span class="azha-brand-label">Created by</span>
      <div class="azha-brand-row">
        <img src="channels4_profile.jpg" alt="AZHA MOH logo" class="azha-brand-logo" />
        <span class="azha-brand-text">AZHA MOH</span>
      </div>
    </div>

    <script>
      const SEARCH_INDEX = [
        { title: 'Home', category: 'Page', description: 'CoderAlyan landing page.', link: 'index.html' },
        { title: 'Explore Other Websites', category: 'Page', description: 'Links to other Coder Alyan projects.', link: 'Explore.html' },
        { title: "Let's Talk", category: 'Page', description: 'Get in touch.', link: 'Talk.html' },
        { title: 'Info', category: 'Page', description: 'About this build.', link: 'Info.html' },
        { title: 'Soccer Player Stats', category: 'Page', description: 'Season stats for standout soccer players.', link: 'PlayerStats.html' },
        { title: 'Games', category: 'Page', description: 'Play games right in the browser.', link: 'Games.html' },

        { title: 'Google 2.0', category: 'Website', description: 'External project by Coder Alyan.', link: 'https://google2o.base44.app/' },
        { title: 'Pitch Master', category: 'Website', description: 'External project by Coder Alyan.', link: 'https://pitch-master-silky-play.base44.app/' },
        { title: 'City Crafter', category: 'Website', description: 'External project by Coder Alyan.', link: 'https://citycrafter.base44.app/' },

        { title: 'Tic-Tac-Toe', category: 'Game', description: 'Classic two-player X\'s and O\'s.', link: 'Games.html' },
        { title: 'Memory Match', category: 'Game', description: 'Flip cards and find every pair.', link: 'Games.html' },
        { title: 'Rock Paper Scissors', category: 'Game', description: 'Beat the computer, best of luck.', link: 'Games.html' },
        { title: 'War', category: 'Game', description: 'Highest card takes the pot, against the AI.', link: 'Games.html' },

        { title: 'Lionel Messi', category: 'Player', description: 'Forward, Inter Miami.', link: 'PlayerStats.html' },
        { title: 'Erling Haaland', category: 'Player', description: 'Forward, Manchester City.', link: 'PlayerStats.html' },
        { title: 'Kevin De Bruyne', category: 'Player', description: 'Midfielder, Manchester City.', link: 'PlayerStats.html' },
        { title: 'Virgil van Dijk', category: 'Player', description: 'Defender, Liverpool.', link: 'PlayerStats.html' },
        { title: 'Alisson Becker', category: 'Player', description: 'Goalkeeper, Liverpool.', link: 'PlayerStats.html' },
      ];

      const searchInput = document.getElementById('siteSearch');
      const resultList = document.getElementById('resultList');
      const resultCount = document.getElementById('resultCount');
      const noResults = document.getElementById('noResults');

      function webSearchUrl(query) {
        return `https://www.google.com/search?q=${encodeURIComponent(query)}`;
      }

      function renderResults(query) {
        const raw = query.trim();
        const q = raw.toLowerCase();
        const matches = SEARCH_INDEX.filter((item) => {
          return (
            item.title.toLowerCase().includes(q) ||
            item.category.toLowerCase().includes(q) ||
            item.description.toLowerCase().includes(q)
          );
        });

        resultList.innerHTML = '';
        matches.forEach((item) => {
          const card = document.createElement('a');
          card.className = 'result-card';
          card.href = item.link;
          if (item.link.startsWith('http')) {
            card.target = '_blank';
            card.rel = 'noopener noreferrer';
          }

          card.innerHTML = `
            <div class="result-info">
              <h3>${item.title}</h3>
              <p>${item.description}</p>
            </div>
            <span class="badge">${item.category}</span>
          `;
          resultList.appendChild(card);
        });

        if (raw) {
          const webCard = document.createElement('a');
          webCard.className = 'result-card web';
          webCard.href = webSearchUrl(raw);
          webCard.target = '_blank';
          webCard.rel = 'noopener noreferrer';
          webCard.innerHTML = `
            <div class="result-info">
              <h3>Search the web for "${raw}"</h3>
              <p>Opens results from across the internet in a new tab.</p>
            </div>
            <span class="badge">Web</span>
          `;
          resultList.appendChild(webCard);
        }

        noResults.style.display = raw && matches.length === 0 ? 'block' : 'none';
        resultCount.textContent = q
          ? `${matches.length} result${matches.length === 1 ? '' : 's'} on this site`
          : `${matches.length} items`;
      }

      searchInput.addEventListener('input', () => renderResults(searchInput.value));
      searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && searchInput.value.trim()) {
          window.open(webSearchUrl(searchInput.value.trim()), '_blank', 'noopener,noreferrer');
        }
      });
      renderResults('');
    </script>

    <script>
      const supabaseUrl = 'https://xfwlmjktnqezvslabsrc.supabase.co';
      const supabaseKey = 'sb_publishable_IXGnAQnXbbMM1hkcK3wM-Q_tDO9B7fP';
      const supabase = window.supabase ? window.supabase.createClient(supabaseUrl, supabaseKey) : null;

      function setMessage(text, isError = false) {
        const el = document.getElementById('accountMessage');
        if (!el) return;
        el.textContent = text;
        el.style.color = isError ? '#ff9aa2' : '#8be9fd';
      }

      async function updateAccountButton() {
        const button = document.getElementById('accountBtn');
        if (!button) return;

        if (!supabase) {
          button.textContent = 'Account';
          return;
        }

        const { data: { session } } = await supabase.auth.getSession();

        if (session && session.user) {
          const email = session.user.email || 'Account';
          button.textContent = email;
        } else {
          button.textContent = 'Account';
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        const accountBtn = document.getElementById('accountBtn');
        const accountModal = document.getElementById('accountModal');
        const closeBtn = document.getElementById('closeAccountModal');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');

        updateAccountButton();

        accountBtn.addEventListener('click', () => {
          accountModal.classList.add('open');
          setMessage('');
          if (!supabase) {
            setMessage('Supabase is not available. Check the script connection.', true);
          }
        });

        closeBtn.addEventListener('click', () => {
          accountModal.classList.remove('open');
        });

        accountModal.addEventListener('click', (event) => {
          if (event.target === accountModal) {
            accountModal.classList.remove('open');
          }
        });

        loginForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (!supabase) {
            setMessage('Supabase is not available. Check the script connection.', true);
            return;
          }

          const email = document.getElementById('loginEmail').value.trim();
          const password = document.getElementById('loginPassword').value;

          const { data, error } = await supabase.auth.signInWithPassword({ email, password });

          if (error) {
            setMessage(error.message, true);
            return;
          }

          if (data.user) {
            await updateAccountButton();
            accountModal.classList.remove('open');
            loginForm.reset();
            setMessage('Logged in successfully!');
          }
        });

        signupForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (!supabase) {
            setMessage('Supabase is not available. Check the script connection.', true);
            return;
          }

          const displayName = document.getElementById('signupUsername').value.trim();
          const email = document.getElementById('signupEmail').value.trim();
          const password = document.getElementById('signupPassword').value;

          if (!email || !password) {
            setMessage('Please enter an email and password.', true);
            return;
          }

          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
              data: {
                username: displayName || email.split('@')[0]
              }
            }
          });

          if (error) {
            setMessage(error.message, true);
            return;
          }

          if (data.user) {
            await updateAccountButton();
            accountModal.classList.remove('open');
            signupForm.reset();
            setMessage('Account created! Check your email for confirmation.');
          }
        });

        accountBtn.addEventListener('dblclick', async () => {
          if (!supabase) {
            setMessage('Supabase is not available. Check the script connection.', true);
            return;
          }

          const { error } = await supabase.auth.signOut();
          if (!error) {
            await updateAccountButton();
            setMessage('Signed out.');
          }
        });
      });
    </script>
  </body>
</html>
